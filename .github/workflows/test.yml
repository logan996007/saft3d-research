name: CPU tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[fem,test]"
      - run: python -m pytest -q
      - run: python -m saft3d --shape tetrahedron --backend cpu --max-new-vertices 0 --completion none --out output/ci-smoke
